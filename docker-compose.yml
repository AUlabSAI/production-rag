services:
  api:
    build: .
    image: production-rag:latest
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      HF_HOME: /cache/huggingface
    volumes:
      - chroma:/app/chroma_db
      - hf_cache:/cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: unless-stopped

  ingest:
    image: production-rag:latest
    profiles: ["tools"]
    command: ["python", "-m", "app.ingest"]
    env_file: .env
    environment:
      HF_HOME: /cache/huggingface
    volumes:
      - ./data:/app/data:ro
      - chroma:/app/chroma_db

volumes:
  chroma:
  hf_cache: