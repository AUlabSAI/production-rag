[project]
name = "production-rag-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vamanpally Sai Snehal", email = "sai.snehal.vamanpally@aus.ac.in" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "langchain>=1.5.2",
    "langchain-chroma>=1.2.0",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.8.5",
    "langchain-text-splitters>=1.2.0",
    "langfuse>=5.2.0",
    "pypdf>=7.1.1",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.3.0",
    "torch>=2.15.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
production-rag-project = "production_rag_project:main"

[tool.uv.sources]
torch = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100